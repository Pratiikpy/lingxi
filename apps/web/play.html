<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF7E8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Lingxi · 灵犀</title>
    <script>
      // Telegram's Mini App script, fetched only when Telegram opened this page; it must run before the game's scripts
      (function () {
        try {
          if (/tgWebApp/.test(location.hash + location.search) || sessionStorage.getItem("__telegram__initParams"))
            document.write('<script src="https://telegram.org/js/telegram-web-app.js?65"><\/script>');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Raise a little mind: a pet whose brain is a real circuit of NAND gates, taped out on X Layer once you keep it there." />
  </head>
  <body>
    <!-- P3: painted at once while the game's code arrives; React replaces it -->
    <div id="root"><div class="boot-splash" role="status" aria-live="polite"><b>Lingxi · 灵犀</b><span class="boot-dot" aria-hidden="true"></span></div></div>
    <style>
      .boot-splash { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 14px; background: #fff7e8; color: #2b2140; font: 600 22px/1.2 system-ui, sans-serif; }
      .boot-dot { width: 14px; height: 14px; border-radius: 50%; background: #ff7a59; animation: boot-pulse 1s ease-in-out infinite alternate; }
      @keyframes boot-pulse { to { transform: scale(0.55); opacity: 0.5; } }
      @media (prefers-color-scheme: dark) { .boot-splash { background: #1e1830; color: #fff7e8; } }
      @media (prefers-reduced-motion: reduce) { .boot-dot { animation: none; } }
    </style>
    <script type="module" src="/src/play/main.tsx"></script>
  </body>
</html>
