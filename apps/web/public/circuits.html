<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lingxi circuits</title>
<meta name="description" content="Every Lingxi circuit on X Layer, its pins, what each bit means, and test vectors. Run any of them on X Layer from this page.">
<style>
  :root { --bg: #fffdf8; --card: #ffffff; --ink: #2b2140; --soft: #5d5470; --line: #2b2140; --ok: #1f7a4a; --bad: #b42318; --accent: #ffd45e; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1630; --card: #241d3d; --ink: #fff3e2; --soft: #c9beea; --line: #c9beea; --ok: #7fe0a8; --bad: #ffb4a8; --accent: #ffd45e; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 32px 0 8px; }
  p { margin: 6px 0; }
  .soft { color: var(--soft); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  button, select, input { font: inherit; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; min-height: 40px; }
  button { cursor: pointer; font-weight: 700; }
  button.primary { background: var(--accent); color: #2b2140; border-color: #2b2140; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #5aa9e6; outline-offset: 2px; }
  code, .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 14px; overflow-wrap: anywhere; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
  .card h3 { margin: 0 0 4px; font-size: 17px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; border-bottom: 1px solid var(--soft); padding: 4px 6px; vertical-align: top; }
  .wrap { overflow-x: auto; }
  .ok { color: var(--ok); font-weight: 700; }
  .bad { color: var(--bad); font-weight: 700; }
  .pins { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; }
  .pins label { display: grid; gap: 2px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title">Lingxi circuits</h1>
    <button type="button" id="lang">中文</button>
  </div>
  <p id="about" class="soft"></p>
  <p class="soft" id="note"></p>
  <p><a id="json" href="circuits.json">circuits.json</a> · <span id="proc"></span></p>

  <h2 id="h-enc">How to call one</h2>
  <div class="card mono" id="enc"></div>

  <h2 id="h-pins">The pet-brain pins (LX-PET/1)</h2>
  <div class="wrap"><table id="pins"></table></div>

  <h2 id="h-rules">Rule circuits</h2>
  <div id="rules"></div>

  <h2 id="h-brains">Starter pet brains</h2>
  <div id="brains"></div>
</main>
<script>
// A second, independent client (H6): no Lingxi game code and no library. It reads the catalogue, calls X Layer's
// public RPC itself (eth_call to the processor's eval and step), and compares the chain's answer with the documented one.
"use strict";
const SEL = { eval: "934d06ea", step: "e8281a1a" }; // first 4 bytes of keccak256("eval(uint256,bytes)") and ("step(uint256,bytes,bytes)")
const T = {
  en: { title: "Lingxi circuits", note: "This page uses none of the game's code: it reads circuits.json and asks X Layer directly.", enc: "How to call one", pins: "The pet-brain pins (LX-PET/1)", rules: "Rule circuits", brains: "Starter pet brains", run: "Run on X Layer", all: "Check every vector on X Layer", input: "input", answer: "X Layer says", documented: "the catalogue says", agree: "agree", differ: "DIFFER", of: "of", vectorsAgree: "vectors agree with X Layer", unreach: "X Layer could not be reached; try again", circuit: "circuit", bits: "input bits", hash: "netlist keccak256", pin: "pins", field: "field", values: "values", outputs: "outputs", inputs: "inputs", next: "next memory", state: "from a fresh (all-zero) memory", want: "want", mood: "mood", nudge: "nudge", processor: "processor", memory: "memory", bitsWord: "bits" },
  zh: { title: "灵犀电路", note: "这个页面没有用游戏的任何代码：它读 circuits.json，直接问 X Layer。", enc: "怎么调用", pins: "宠物大脑的引脚（LX-PET/1）", rules: "规则电路", brains: "初始宠物大脑", run: "在 X Layer 上运行", all: "在 X Layer 上核对全部向量", input: "输入", answer: "X Layer 的答案", documented: "目录里写的", agree: "一致", differ: "不一致", of: "/", vectorsAgree: "条向量与 X Layer 一致", unreach: "暂时连不上 X Layer，请再试", circuit: "电路", bits: "输入位数", hash: "网表 keccak256", pin: "引脚", field: "字段", values: "取值", outputs: "输出", inputs: "输入", next: "下一刻的记忆", state: "从全新（全为 0）的记忆开始", want: "想做", mood: "心情", nudge: "性格推动", processor: "处理器", memory: "记忆", bitsWord: "位" },
};
const LINE_ZH = { gentle: "温柔", bold: "勇敢", curious: "好奇" };
let lang = (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
let cat = null;
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) if (k === "class") e.className = v; else e.setAttribute(k, v); for (const k of kids) e.append(k); return e; };

// --- the ABI by hand: a uint256, then bytes (offset, length, data padded to 32 bytes) ---
const word = (n) => BigInt(n).toString(16).padStart(64, "0");
const pad32 = (hex) => hex + "0".repeat((64 - (hex.length % 64)) % 64);
const packInput = (value, bits) => { let h = ""; for (let i = 0; i < Math.max(1, Math.ceil(bits / 8)); i++) h += Number((BigInt(value) >> BigInt(8 * i)) & 0xffn).toString(16).padStart(2, "0"); return h; };
const unpack = (hex) => { let w = 0n; for (let i = 0; i < hex.length / 2; i++) w |= BigInt(parseInt(hex.slice(2 * i, 2 * i + 2), 16)) << BigInt(8 * i); return w; };
function callEval(id, inputHex) { return "0x" + SEL.eval + word(id) + word(64) + word(inputHex.length / 2) + pad32(inputHex); }
function callStep(id, stateHex, inputHex) {
  const a = word(stateHex.length / 2) + pad32(stateHex);
  return "0x" + SEL.step + word(id) + word(96) + word(96 + a.length / 2) + a + word(inputHex.length / 2) + pad32(inputHex);
}
/** the n-th `bytes` of an ABI-encoded answer */
function bytesAt(ret, n) { const r = ret.slice(2); const off = parseInt(r.slice(64 * n, 64 * n + 64), 16) * 2; const len = parseInt(r.slice(off, off + 64), 16) * 2; return r.slice(off + 64, off + 64 + len); }

let rpc = 0;
async function ethCall(calls) {
  for (let tries = 0; tries < cat.rpcs.length; tries++) {
    const url = cat.rpcs[(rpc + tries) % cat.rpcs.length];
    try {
      const body = calls.map((data, i) => ({ jsonrpc: "2.0", id: i, method: "eth_call", params: [{ to: cat.processor, data }, "latest"] }));
      const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const out = await res.json();
      if (!Array.isArray(out)) throw new Error("not a batch answer");
      out.sort((x, y) => x.id - y.id);
      if (out.some((x) => x.error)) throw new Error(out.find((x) => x.error).error.message);
      rpc = (rpc + tries) % cat.rpcs.length;
      return out.map((x) => x.result);
    } catch (e) { if (tries === cat.rpcs.length - 1) throw e; }
  }
}
// X Layer's public RPCs refuse a batch of 20 calls or more ("too many RPC calls in batch request"); 10 is accepted
async function inChunks(calls, size = 10) { const all = []; for (let i = 0; i < calls.length; i += size) all.push(...(await ethCall(calls.slice(i, i + size)))); return all; }

function render() {
  const t = T[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  $("lang").textContent = lang === "zh" ? "EN" : "中文";
  $("title").textContent = t.title; document.title = t.title;
  $("about").textContent = cat.about[lang];
  $("note").textContent = t.note;
  $("proc").textContent = `${t.processor} ${cat.processor} · chain ${cat.chainId}`;
  $("h-enc").textContent = t.enc; $("h-pins").textContent = t.pins; $("h-rules").textContent = t.rules; $("h-brains").textContent = t.brains;
  $("enc").replaceChildren(...Object.entries(cat.encoding).map(([k, v]) => el("p", {}, el("b", {}, `${k}: `), v)));
  const pins = $("pins");
  pins.replaceChildren(el("tr", {}, el("th", {}, t.field), el("th", {}, t.pin), el("th", {}, t.values)));
  for (const [kind, list] of [[t.inputs, cat.brainPins.inputs], [t.outputs, cat.brainPins.outputs]]) {
    pins.append(el("tr", {}, el("th", { colspan: "3" }, kind)));
    for (const f of list) pins.append(el("tr", {}, el("td", {}, f.name), el("td", { class: "mono" }, f.bits > 1 ? `${f.lo}-${f.lo + f.bits - 1}` : `${f.lo}`), el("td", {}, f.values.map((v, i) => `${i} ${v}`).join(" · "))));
  }
  $("rules").replaceChildren(...cat.rules.map(ruleCard));
  $("brains").replaceChildren(...cat.brains.map(brainCard));
}

function ruleCard(r) {
  const t = T[lang];
  const input = el("input", { type: "number", min: "0", max: String(2 ** r.inBits - 1), value: String(r.vectors[Math.min(1, r.vectors.length - 1)][0]), "aria-label": `${r.name} ${t.input}` });
  const out = el("p", { "aria-live": "polite" });
  const run = el("button", { type: "button", class: "primary" }, t.run);
  const all = el("button", { type: "button" }, t.all);
  run.onclick = async () => {
    const v = Math.max(0, Math.min(2 ** r.inBits - 1, Number(input.value) | 0));
    out.textContent = "…";
    try {
      const [ret] = await ethCall([callEval(r.id, packInput(v, r.nIn))]);
      const got = Number(unpack(bytesAt(ret, 0)) & 0xffn);
      const doc = r.vectors.find(([i]) => i === v);
      out.replaceChildren(`${t.input} ${v} → ${t.answer} ${got}`, doc ? el("span", { class: got === doc[1] ? "ok" : "bad" }, ` · ${t.documented} ${doc[1]} · ${got === doc[1] ? t.agree : t.differ}`) : "");
    } catch { out.textContent = t.unreach; }
  };
  all.onclick = async () => {
    out.textContent = "…";
    try {
      const rets = await inChunks(r.vectors.map(([i]) => callEval(r.id, packInput(i, r.nIn))));
      const good = rets.filter((ret, k) => Number(unpack(bytesAt(ret, 0)) & 0xffn) === r.vectors[k][1]).length;
      out.replaceChildren(el("span", { class: good === r.vectors.length ? "ok" : "bad" }, `${good} ${t.of} ${r.vectors.length} ${t.vectorsAgree}`));
    } catch { out.textContent = t.unreach; }
  };
  return el("div", { class: "card", id: `rule-${r.name}` },
    el("h3", {}, `${r.name} · ${t.circuit} #${r.id}`),
    el("p", {}, r.about[lang]),
    el("p", { class: "soft mono" }, `${r.nIn} → ${r.outBits} · ${t.bits} ${r.inBits} · ${t.hash} ${r.netlistKeccak}`),
    el("div", { class: "row" }, input, run, all), out);
}

function brainCard(b) {
  const t = T[lang];
  const selects = cat.brainPins.inputs.map((f) => { const s = el("select", { "aria-label": f.name }); f.values.forEach((v, i) => s.append(el("option", { value: String(i) }, `${i} ${v}`))); return [f, s]; });
  const out = el("p", { "aria-live": "polite" });
  const run = el("button", { type: "button", class: "primary" }, t.run);
  const all = el("button", { type: "button" }, t.all);
  const field = (w, f) => (w >> f.lo) & ((1 << f.bits) - 1);
  run.onclick = async () => {
    const w = selects.reduce((acc, [f, s]) => acc | (Number(s.value) << f.lo), 0);
    out.textContent = "…";
    try {
      const [ret] = await ethCall([callStep(b.id, packInput(0, b.nState), packInput(w, 16))]);
      const next = Number(unpack(bytesAt(ret, 0))); const o = Number(unpack(bytesAt(ret, 1)) & 0xffn);
      const [want, mood, nudge] = cat.brainPins.outputs.map((f) => f.values[field(o, f)]);
      const doc = b.vectors.find((v) => v.input === w);
      out.replaceChildren(`${t.input} ${w} → ${t.want} ${want} · ${t.mood} ${mood} · ${t.nudge} ${nudge} · ${t.next} ${next}`, doc ? el("span", { class: doc.output === o && doc.nextState === next ? "ok" : "bad" }, ` · ${doc.output === o && doc.nextState === next ? t.agree : t.differ}`) : "");
    } catch { out.textContent = t.unreach; }
  };
  all.onclick = async () => {
    out.textContent = "…";
    try {
      const rets = await inChunks(b.vectors.map((v) => callStep(b.id, packInput(0, b.nState), packInput(v.input, 16))));
      const good = rets.filter((ret, k) => Number(unpack(bytesAt(ret, 1)) & 0xffn) === b.vectors[k].output && Number(unpack(bytesAt(ret, 0))) === b.vectors[k].nextState).length;
      out.replaceChildren(el("span", { class: good === b.vectors.length ? "ok" : "bad" }, `${good} ${t.of} ${b.vectors.length} ${t.vectorsAgree}`));
    } catch { out.textContent = t.unreach; }
  };
  return el("div", { class: "card", id: `brain-${b.line}` },
    el("h3", {}, `${lang === "zh" ? `${LINE_ZH[b.line] ?? b.line}初始大脑` : b.name} · ${t.circuit} #${b.id}`),
    el("p", { class: "soft mono" }, `${b.nIn} → ${b.nOut} · ${t.memory} ${b.nState} ${t.bitsWord} (${b.memory.map((m) => `${m.name} ${m.bits}`).join(", ")}) · ${t.hash} ${b.netlistKeccak}`),
    el("p", { class: "soft" }, t.state),
    el("div", { class: "pins" }, ...selects.map(([f, s]) => el("label", {}, f.name, s))),
    el("div", { class: "row" }, run, all), out);
}

$("lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; render(); };
fetch("circuits.json").then((r) => r.json()).then((c) => { cat = c; render(); }).catch(() => { $("about").textContent = "circuits.json could not be read."; });
</script>
</body>
</html>
