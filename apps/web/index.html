<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF7E8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Lingxi · Raise a little mind</title>
    <meta name="description" content="Raise a little mind: a pet whose brain is a real circuit of NAND gates, taped out on X Layer once you keep it there." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // P3: the first screen (the prerendered landing) is painted before the page's code is even fetched, so on a slow
      // phone that paint never waits behind script download or parsing. The code starts once the browser reports the
      // landing's largest paint (or, where it reports no such thing, its first contentful paint, then two frames); a
      // tab opened in the background, which paints nothing, starts on the timer instead
      let started = false;
      const start = () => {
        if (started) return;
        started = true;
        import("/src/landing/main.tsx");
      };
      const kinds = (typeof PerformanceObserver !== "undefined" && PerformanceObserver.supportedEntryTypes) || [];
      const kind = kinds.includes("largest-contentful-paint") ? "largest-contentful-paint" : kinds.includes("paint") ? "paint" : "";
      if (kind) {
        const seen = new PerformanceObserver((list) => {
          if (!list.getEntries().some((e) => kind !== "paint" || e.name === "first-contentful-paint")) return;
          seen.disconnect();
          requestAnimationFrame(() => setTimeout(start, 0));
        });
        seen.observe({ type: kind, buffered: true });
      } else requestAnimationFrame(() => requestAnimationFrame(start));
      setTimeout(start, 1500);
    </script>
  </body>
</html>
