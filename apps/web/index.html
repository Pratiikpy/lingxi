<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF7E8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Lingxi · Raise a little mind</title>
    <meta name="description" content="Raise a little mind: a pet whose brain is a real circuit of NAND gates, taped out on X Layer once you keep it there." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // P3: the first screen (the prerendered landing) paints before the page's code starts running, so a slow phone
      // never holds that paint back behind script; a tab opened in the background, which draws no frames, starts on the
      // timer instead
      let started = false;
      const start = () => {
        if (started) return;
        started = true;
        import("/src/landing/main.tsx");
      };
      requestAnimationFrame(() => requestAnimationFrame(start));
      setTimeout(start, 250);
    </script>
  </body>
</html>
