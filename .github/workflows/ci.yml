name: CI

on:
  push:
  pull_request:
  schedule:
    # the fork tests read X Layer as it is today, so they also run once a day on their own
    - cron: "17 3 * * *"
  # the nightly run can also be started by hand; `revert` names the revert entries to check (comma-separated), or
  # leaves it empty to check them all
  workflow_dispatch:
    inputs:
      revert:
        description: Revert entries to check, comma-separated (empty for all)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the hygiene check reads every commit message
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
          # the fork's cache is kept by the steps below, saved even when a test fails (P3a)
          cache: false
      # P3a: what the fork has fetched from X Layer, kept between runs whatever their result (the toolchain's own cache
      # is saved only when a job passes, so a red run left the next to fetch everything again from an endpoint that
      # answers a burst from one address with 403)
      - name: The fork's cache from earlier runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: check-fork-${{ github.run_id }}
          restore-keys: |
            check-fork-
            linux-foundry-chain-fork-check-
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Contract tests
        run: forge test
        working-directory: contracts
      - name: Contract tests on a fork of X Layer mainnet (reads only)
        run: forge test --fork-url xlayer --match-path 'test/*.fork.t.sol'
        working-directory: contracts
      - name: Server tests with its fork tests, on a pinned fork (reads X Layer only)
        run: pnpm test:fork
      - name: Keep the fork's cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: check-fork-${{ github.run_id }}
      - name: README numbers, repo hygiene
        run: pnpm status:check --only promises,hygiene && pnpm exec tsx scripts/readme-facts.mts --check --no-tests
      - name: The web build, with its name guard
        run: pnpm --filter @lingxi/web build
        env:
          VITE_CHAIN: xlayer

  coverage:
    # how much of each part's code its tests run, held to 80% of lines and branches (scripts/coverage.mts)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
          # the fork's cache is kept by the steps below, saved even when a test fails (P3a)
          cache: false
      - name: The fork's cache from earlier runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: coverage-fork-${{ github.run_id }}
          restore-keys: |
            coverage-fork-
            check-fork-
            linux-foundry-chain-fork-coverage-
      - run: pnpm install --frozen-lockfile
      # the chain package's fork tests deploy contracts from their compiled artifacts (contracts/out)
      - name: Compile the contracts
        run: forge build
        working-directory: contracts
      - name: Coverage, every part at or above 80%
        run: pnpm coverage
      - name: Keep the fork's cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: coverage-fork-${{ github.run_id }}

  e2e:
    # the game played in a browser against a fork of X Layer mainnet, with the server and the game started by the
    # suite itself (e2e/harness/run.ts); a failure keeps its report, traces and videos. The suite is split in four,
    # each part with its own fork, server and game, so it stays well inside the job's time as specs are added (the
    # whole suite in one job passed 45 minutes on 0c27429; three parts did too once the specs began waiting for the
    # server's first readings of the fork, P3a)
    name: e2e ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
          # the fork's cache is kept by the steps below, saved even when a test fails (P3a)
          cache: false
      # P3a: what the fork has fetched from X Layer, kept between runs whatever their result (the toolchain's own cache
      # is saved only when a job passes, so a red run left the next to fetch everything again from an endpoint that
      # answers a burst from one address with 403)
      - name: The fork's cache from earlier runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: e2e-fork-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            e2e-fork-${{ matrix.shard }}-
            e2e-fork-
            linux-foundry-chain-fork-e2e-
      - run: pnpm install --frozen-lockfile
      - name: The browser the suite plays in
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end, on a fork of X Layer mainnet
        run: pnpm e2e --shard=${{ matrix.shard }}/4
      - name: Keep the fork's cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: e2e-fork-${{ matrix.shard }}-${{ github.run_id }}
      - name: Keep the report, traces and videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          # the harness keeps its logs under e2e/.run, a hidden folder the action skips unless asked
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            e2e/.run/*/*.log
          retention-days: 14

  revert:
    # every fix has a test that fails with the fix undone (scripts/revert-check.mts): a push checks the entries it adds
    # or changes, the nightly run checks all of them (and so a patch the code has moved away from), a run started by
    # hand checks the entries it names or all of them. Its browser entries start their own fork, server and game, which
    # is why this runs here rather than on a PC short of memory (A35).
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EVENT: ${{ github.event_name }}
      BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      NAMED: ${{ inputs.revert }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit before the push, to see which entries it changed
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Which entries this run checks
        id: pick
        run: |
          if [ "$EVENT" = "push" ] || [ "$EVENT" = "pull_request" ]; then
            ids=$(pnpm exec tsx scripts/revert-check.mts --changed "$BEFORE" --list)
          elif [ -n "$NAMED" ]; then
            ids=$(pnpm exec tsx scripts/revert-check.mts --only "$NAMED" --list)
          else
            ids=$(pnpm exec tsx scripts/revert-check.mts --list)
          fi
          echo "ids=${ids// /,}" >> "$GITHUB_OUTPUT"
          echo "checking: ${ids:-nothing}"
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        if: steps.pick.outputs.ids != ''
        with:
          version: v1.7.1
      - name: The browser the browser entries play in
        if: steps.pick.outputs.ids != ''
        run: pnpm exec playwright install --with-deps chromium
      - name: Revert checks
        if: steps.pick.outputs.ids != ''
        env:
          IDS: ${{ steps.pick.outputs.ids }}
          # the scratch worktree lands here and is kept, so a failure's logs can be kept too
          TMPDIR: ${{ runner.temp }}/revert
        run: mkdir -p "$TMPDIR" && pnpm exec tsx scripts/revert-check.mts --only "$IDS" --keep
      - name: Keep the logs of a failing run
        if: failure() && steps.pick.outputs.ids != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: revert-logs
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/revert/*/test-results/
            ${{ runner.temp }}/revert/*/e2e/.run/*/*.log
          retention-days: 14
