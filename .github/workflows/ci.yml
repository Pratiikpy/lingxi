name: CI

on:
  push:
  pull_request:
  schedule:
    # the fork tests read X Layer as it is today, so they also run once a day on their own
    - cron: "17 3 * * *"
  # the nightly run, started by hand (GitHub has not yet fired this repo's schedule)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the hygiene check reads every commit message
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Contract tests
        run: forge test
        working-directory: contracts
      - name: Contract tests on a fork of X Layer mainnet (reads only)
        run: forge test --fork-url xlayer --match-path 'test/*.fork.t.sol'
        working-directory: contracts
      - name: README numbers, repo hygiene
        run: pnpm status:check --only promises,hygiene && pnpm exec tsx scripts/readme-facts.mts --check
      - name: The web build, with its name guard
        run: pnpm --filter @lingxi/web build
        env:
          VITE_CHAIN: xlayer

  e2e:
    # the game played in a browser against a fork of X Layer mainnet, with the server and the game started by the
    # suite itself (e2e/harness/run.ts); a failure keeps its report, traces and videos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - name: The browser the suite plays in
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end, on a fork of X Layer mainnet
        run: pnpm e2e
      - name: Keep the report, traces and videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          # the harness keeps its logs under e2e/.run, a hidden folder the action skips unless asked
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            e2e/.run/*/*.log
          retention-days: 14
