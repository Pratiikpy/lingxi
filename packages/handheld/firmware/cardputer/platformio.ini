; Lingxi on an M5Stack Cardputer ADV (ESP32-S3, 240x135 screen, 56 keys): the shared C core in ../../core with a
; thin platform layer for the keys, the screen, the clock the game gives over USB, and flash storage.
;
;   pio run -d packages/handheld/firmware/cardputer                build
;   pio run -d packages/handheld/firmware/cardputer -t upload      build and flash over USB-C
;   pio device monitor -b 115200                                   the link and the boot log
;
; Versions are pinned: a library update must not change what the device runs without a rebuild being reviewed.
[platformio]
default_envs = cardputer-adv

[common]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> +<../../../core/*.c>
build_flags =
  -I../../core
  -std=gnu99
  ; keep the build machine's paths out of the image
  -ffile-prefix-map=${platformio.packages_dir}=packages
  -ffile-prefix-map=$PROJECT_DIR=project

[env:cardputer-adv]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = ${common.build_src_filter}
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Cardputer@1.1.1
  m5stack/M5Unified@0.2.22
  m5stack/M5GFX@0.2.29

; The same core on the same chip with no device around it, for an ESP32-S3 emulator (Espressif's QEMU): it runs the
; boot self-test (the starter brains' hashes, pet #1's mainnet log) and answers the link's hello on UART0, then stops.
;   pio run -d packages/handheld/firmware/cardputer -e selftest
[env:selftest]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
; the emulator's flash chip answers in DIO, not the QIO the board's default libraries expect
board_build.flash_mode = dio
build_src_filter = ${common.build_src_filter}
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLX_SELFTEST_ONLY=1